# --- C. INICIALIZACIÓN DE DATOS (SEEDING) ---
# Garantiza que Hibernate genere primero el esquema de la base de datos (DDL) antes de ejecutar scripts DML como data.sql.
# spring.jpa.defer-datasource-initialization=true