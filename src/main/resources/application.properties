# ===================================================================
# HARDPC BACKEND - APPLICATION PROPERTIES
# ===================================================================

# ===================================================================
# 1. CONFIGURACIÓN GENERAL
# ===================================================================
spring.application.name=hardpc-backend-api

# ===================================================================
# 2. CONFIGURACIÓN DE BASE DE DATOS (PRODUCCIÓN / AIVEN CLOUD) - ACTIVO
# ===================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# 3. CONFIGURACIÓN DE HIBERNATE / JPA (GLOBAL)
# ===================================================================
# Propiedad que ayuda a Hibernate a optimizar las consultas para el dialecto MySQL.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 'update': Actualiza el esquema de la BD sin eliminar los datos existentes (Ideal para MVP).
spring.jpa.hibernate.ddl-auto=update

# Mostrar y dar formato a las consultas SQL en la consola (útil para depuración del backend).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# 4. GESTIÓN DE ERRORES Y RUTAS WEB (API REST)
# ===================================================================
# Habilitar el lanzamiento de excepción cuando no se encuentra un handler/endpoint (404).
spring.mvc.throw-exception-if-no-handler-found=true

# Deshabilitar el mapeo de recursos estáticos por defecto (necesario para que la propiedad anterior funcione estrictamente en APIs REST).
spring.web.resources.add-mappings=false


# ===================================================================
# ===================================================================
# SECCIÓN DE ENTORNOS INACTIVOS (DESARROLLO LOCAL / PRUEBAS)
# Descomentar estas líneas únicamente si se necesita trabajar offline.
# ===================================================================
# ===================================================================

